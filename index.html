<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>iライフログ</title>
<style>
  :root {
    --bg: #0f172a;
    --card-bg: #1e293b;
    --text: #f8fafc;
    --text-sub: #94a3b8;
    --accent: #38bdf8;
    --running: #ef4444;
    --border: #334155;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--text); padding: 16px; padding-bottom: 60px; max-width: 600px; margin: 0 auto; }
  
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .header h1 { font-size: 1.2rem; font-weight: bold; }
  .header-btns { display: flex; gap: 8px; }
  .btn-sm { background: var(--card-bg); border: 1px solid var(--border); color: var(--text); padding: 6px 10px; border-radius: 8px; font-size: 0.8rem; cursor: pointer; }
  
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 24px; }
  .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 14px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; }
  .card.running { border: 2px solid var(--running); background: rgba(239, 68, 68, 0.1); }
  .card-top { display: flex; justify-content: space-between; align-items: center; }
  .card-icon { font-size: 1.5rem; }
  .card-status { font-size: 0.75rem; font-weight: bold; color: var(--text-sub); }
  .card.running .card-status { color: var(--running); }
  .card-name { font-weight: bold; font-size: 1rem; }
  .card-timer { font-size: 0.85rem; color: var(--text-sub); }
  .card.running .card-timer { color: var(--running); font-weight: bold; }
  
  h2 { font-size: 0.9rem; color: var(--text-sub); margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
  .history-list { display: flex; flex-direction: column; gap: 8px; }
  .history-item { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
  .history-left { display: flex; align-items: center; gap: 10px; }
  .history-meta { font-size: 0.75rem; color: var(--text-sub); }
  .history-dur { font-size: 0.9rem; font-weight: bold; color: var(--accent); }
  .history-thumbs { display: flex; gap: 4px; }
  .history-img-thumb { width: 32px; height: 32px; border-radius: 4px; object-fit: cover; }
  
  .modal { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.7); align-items: center; justify-content: center; padding: 20px; z-index: 100; }
  .modal-box { background: var(--card-bg); padding: 20px; border-radius: 12px; width: 100%; max-width: 380px; border: 1px solid var(--border); max-height: 90vh; overflow-y: auto; }
  .modal-box input, .modal-box textarea { width: 100%; padding: 8px; margin: 4px 0 12px; background: #0f172a; border: 1px solid var(--border); color: #fff; border-radius: 6px; }
  .modal-btns { display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px; }
  .btn-action { padding: 8px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; border: none; font-size: 0.85rem; }
  .btn-submit { background: #3b82f6; color: #fff; }
  .btn-danger { background: #ef4444; color: #fff; }
  .btn-cancel { background: transparent; border: 1px solid var(--border); color: var(--text-sub); }
  .del-tag { background: #334155; border: none; color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; margin: 2px; cursor: pointer; }
  
  .preview-grid { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
  .preview-img-wrap { position: relative; }
  .preview-img-wrap img { width: 100%; border-radius: 6px; }
  .preview-img-wrap button { position: absolute; top: 4px; right: 4px; background: rgba(0, 0, 0, 0.6); color: #fff; border: none; border-radius: 4px; padding: 2px 6px; cursor: pointer; }
</style>
</head>
<body>

<div class="header">
  <h1>⚡ iライフログ</h1>
  <div class="header-btns">
    <button class="btn-sm" onclick="exportEvernote()">Evernote出力</button>
    <button class="btn-sm" onclick="openCatModal()">＋ カテゴリ</button>
  </div>
</div>

<div class="grid" id="grid"></div>

<h2>
  <span>本日の履歴</span>
  <span style="font-size:0.75rem;color:var(--accent);">※タップして修正・写真追加</span>
</h2>
<div class="history-list" id="history"></div>

<!-- カテゴリ追加モーダル -->
<div class="modal" id="catModal">
  <div class="modal-box">
    <h3 style="margin-bottom:12px;">カテゴリ追加</h3>
    <label style="font-size:0.8rem;color:var(--text-sub);">アイコン（絵文字）</label>
    <input type="text" id="catIcon" value="📌" maxlength="2">
    <label style="font-size:0.8rem;color:var(--text-sub);">カテゴリ名</label>
    <input type="text" id="catName">
    <div class="modal-btns">
      <button class="btn-action btn-cancel" onclick="closeCatModal()">閉じる</button>
      <button class="btn-action btn-submit" onclick="addCategory()">追加</button>
    </div>
    <div style="margin-top:16px;border-top:1px solid var(--border);padding-top:12px;">
      <div style="font-size:0.75rem;color:var(--text-sub);margin-bottom:6px;">タップしてカテゴリ削除:</div>
      <div id="delList"></div>
    </div>
  </div>
</div>

<!-- ログ編集・写真モーダル -->
<div class="modal" id="editModal">
  <div class="modal-box">
    <h3 style="margin-bottom:12px;" id="editModalTitle">ログ編集</h3>
    <input type="hidden" id="editLogId">
    
    <label style="font-size:0.8rem;color:var(--text-sub);">開始時刻</label>
    <input type="time" id="editStartTime">
    
    <label style="font-size:0.8rem;color:var(--text-sub);">終了時刻</label>
    <input type="time" id="editEndTime">
    
    <label style="font-size:0.8rem;color:var(--text-sub);">メモ</label>
    <textarea id="editMemo" rows="3"></textarea>
    
    <label style="font-size:0.8rem;color:var(--text-sub);">写真の追加（複数選択可）</label>
    <input type="file" id="editPhoto" accept="image/*" multiple onchange="handlePhotoUpload(event)">
    <div id="imagePreviewContainer" class="preview-grid"></div>

    <div class="modal-btns">
      <button class="btn-action btn-danger" onclick="deleteCurrentLog()">削除</button>
      <button class="btn-action btn-cancel" onclick="closeEditModal()">キャンセル</button>
      <button class="btn-action btn-submit" onclick="saveLogEdit()">保存</button>
    </div>
  </div>
</div>

<script>
  const DEFAULT_CATS = [
    { id: 'move', name: '移動→', icon: '⇢' },
    { id: 'coffee', name: '珈琲 ☕ Time', icon: '☕' },
    { id: 'work', name: '仕事 🧳', icon: '💼' },
    { id: 'meal', name: '食事', icon: '🍽' },
    { id: 'rest', name: '休憩', icon: '☕' },
    { id: 'exercise', name: '運動', icon: '🏃' },
    { id: 'housework', name: '家事', icon: '🧹' },
    { id: 'sleep', name: '睡眠', icon: '🌙' }
  ];

  let cats = JSON.parse(localStorage.getItem('ll_cats') || JSON.stringify(DEFAULT_CATS));
  let logs = JSON.parse(localStorage.getItem('ll_logs') || '[]');
  let currentPhotos = [];

  function save() {
    localStorage.setItem('ll_cats', JSON.stringify(cats));
    localStorage.setItem('ll_logs', JSON.stringify(logs));
    render();
  }

  function toggleLog(c) {
    const i = logs.findIndex(l => l.catId === c.id && !l.endAt);
    if (i >= 0) {
      logs[i].endAt = new Date().toISOString();
    } else {
      logs.unshift({
        id: Date.now().toString(),
        catId: c.id,
        name: c.name,
        icon: c.icon,
        startAt: new Date().toISOString(),
        endAt: null,
        memo: '',
        photos: []
      });
    }
    save();
  }

  function formatDuration(s, e) {
    const sec = Math.max(0, Math.floor(((e ? new Date(e) : new Date()) - new Date(s)) / 1000));
    const m = Math.floor(sec / 60);
    if (m < 60) return `${m}分`;
    return `${Math.floor(m / 60)}時間 ${m % 60}分`;
  }

  function formatTimeSingleDigit(s) {
    if (!s) return '';
    const d = new Date(s);
    return `${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`;
  }

  function timeInputFormat(s) {
    if (!s) return '';
    const d = new Date(s);
    return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
  }

  function render() {
    const g = document.getElementById('grid');
    g.innerHTML = cats.map(c => {
      const r = logs.find(l => l.catId === c.id && !l.endAt);
      return `
        <div class="card ${r ? 'running' : ''}" onclick="toggleLog(${JSON.stringify(c).replace(/"/g, '&quot;')})">
          <div class="card-top">
            <span class="card-icon">${c.icon}</span>
            <span class="card-status">${r ? '記録中' : '開始'}</span>
          </div>
          <div class="card-name">${c.name}</div>
          <div class="card-timer">${r ? formatDuration(r.startAt) : '00:00:00'}</div>
        </div>
      `;
    }).join('');

    const h = document.getElementById('history');
    const t = new Date().toDateString();
    const tl = logs.filter(l => l.endAt && new Date(l.startAt).toDateString() === t);
    
    if (tl.length === 0) {
      h.innerHTML = '<div style="color:var(--text-sub);font-size:0.85rem;">本日の記録はありません</div>';
    } else {
      h.innerHTML = tl.map(l => {
        const p = l.photos || (l.photo ? [l.photo] : []);
        return `
          <div class="history-item" onclick="openEditModal('${l.id}')">
            <div class="history-left">
              <span style="font-size:1.2rem;">${l.icon}</span>
              <div>
                <div style="font-weight:bold;font-size:0.9rem;">${l.name} ${l.memo ? '📝' : ''}</div>
                <div class="history-meta">${formatTimeSingleDigit(l.startAt)} - ${formatTimeSingleDigit(l.endAt)}</div>
              </div>
            </div>
            <div style="display:flex;align-items:center;gap:8px;">
              <div class="history-thumbs">
                ${p.map(x => `<img src="${x}" class="history-img-thumb">`).join('')}
              </div>
              <div class="history-dur">${formatDuration(l.startAt, l.endAt)}</div>
            </div>
          </div>
        `;
      }).join('');
    }

    document.getElementById('delList').innerHTML = cats.map(c => `
      <button class="del-tag" onclick="deleteCat('${c.id}')">${c.icon} ${c.name} ✕</button>
    `).join('');
  }

  function openCatModal() { document.getElementById('catModal').style.display = 'flex'; }
  function closeCatModal() { document.getElementById('catModal').style.display = 'none'; }
  
  function addCategory() {
    const n = document.getElementById('catName').value.trim();
    const i = document.getElementById('catIcon').value.trim() || '📌';
    if (!n) return;
    cats.push({ id: Date.now().toString(), name: n, icon: i });
    document.getElementById('catName').value = '';
    closeCatModal();
    save();
  }

  function deleteCat(id) {
    cats = cats.filter(c => c.id !== id);
    save();
  }

  function openEditModal(id) {
    const l = logs.find(x => x.id === id);
    if (!l) return;
    document.getElementById('editLogId').value = l.id;
    document.getElementById('editModalTitle').innerText = `${l.icon} ${l.name} の編集`;
    document.getElementById('editStartTime').value = timeInputFormat(l.startAt);
    document.getElementById('editEndTime').value = timeInputFormat(l.endAt);
    document.getElementById('editMemo').value = l.memo || '';
    
    currentPhotos = l.photos ? [...l.photos] : (l.photo ? [l.photo] : []);
    renderPreviewPhotos();
    document.getElementById('editPhoto').value = '';
    document.getElementById('editModal').style.display = 'flex';
  }

  function renderPreviewPhotos() {
    document.getElementById('imagePreviewContainer').innerHTML = currentPhotos.map((p, i) => `
      <div class="preview-img-wrap">
        <img src="${p}">
        <button type="button" onclick="removePhoto(${i})">削除</button>
      </div>
    `).join('');
  }

  function removePhoto(i) {
    currentPhotos.splice(i, 1);
    renderPreviewPhotos();
  }

  function handlePhotoUpload(e) {
    Array.from(e.target.files).forEach(f => {
      const r = new FileReader();
      r.onload = evt => {
        currentPhotos.push(evt.target.result);
        renderPreviewPhotos();
      };
      r.readAsDataURL(f);
    });
  }

  function closeEditModal() { document.getElementById('editModal').style.display = 'none'; }

  function saveLogEdit() {
    const id = document.getElementById('editLogId').value;
    const l = logs.find(x => x.id === id);
    if (!l) return;
    
    const s = document.getElementById('editStartTime').value;
    const e = document.getElementById('editEndTime').value;
    
    if (s) {
      const d = new Date(l.startAt);
      const [h, m] = s.split(':');
      d.setHours(h, m, 0);
      l.startAt = d.toISOString();
    }
    if (e && l.endAt) {
      const d = new Date(l.endAt);
      const [h, m] = e.split(':');
      d.setHours(h, m, 0);
      l.endAt = d.toISOString();
    }
    
    l.memo = document.getElementById('editMemo').value.trim();
    l.photos = currentPhotos;
    delete l.photo;
    
    closeEditModal();
    save();
  }

  function deleteCurrentLog() {
    logs = logs.filter(l => l.id !== document.getElementById('editLogId').value);
    closeEditModal();
    save();
  }

  async function exportEvernote() {
    const td = new Date().toISOString().slice(0, 10);
    const tl = logs.filter(l => l.endAt && l.startAt.startsWith(td)).reverse();
    
    if (tl.length === 0) {
      alert('本日の記録がありません');
      return;
    }

    let html = '<div>';
    let plain = '';

    tl.forEach(l => {
      const tr = `${formatTimeSingleDigit(l.startAt)} - ${formatTimeSingleDigit(l.endAt)} (${formatDuration(l.startAt, l.endAt)})`;
      const p = l.photos || (l.photo ? [l.photo] : []);
      
      html += `
        <h1 style="font-size:36px;margin:0;padding:0;"><font size="7">${l.icon}</font></h1>
        <h2 style="font-size:24px;margin:2px 0 0 0;padding:0;"><font size="5"><b>${l.name}</b></font></h2>
        <p style="font-size:14px;color:#888888;margin:2px 0 4px 0;"><font size="2">${tr}</font></p>
      `;
      plain += `${l.icon}\n${l.name}\n${tr}\n`;

      if (l.memo) {
        html += `<p style="font-size:15px;margin:4px 0 8px 0;white-space:pre-wrap;">${l.memo}</p>`;
        plain += `${l.memo}\n`;
      }
      p.forEach(x => {
        html += `<p style="margin:8px 0;"><img src="${x}" style="max-width:100%;border-radius:4px;display:block;"></p>`;
      });
      html += '<p><br></p>';
      plain += '\n\n';
    });
    html += '</div>';

    try {
      const bh = new Blob([html], { type: 'text/html' });
      const bp = new Blob([plain], { type: 'text/plain' });
      const d = [new ClipboardItem({ 'text/html': bh, 'text/plain': bp })];
      await navigator.clipboard.write(d);
      alert('Evernote用ログをコピーしました！\nEvernoteに貼り付けてください。');
    } catch (err) {
      navigator.clipboard.writeText(plain).then(() => {
        alert('テキストをコピーしました');
      });
    }
  }

  setInterval(render, 1000);
  render();
</script>
</body>
</html>
