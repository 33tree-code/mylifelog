<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>iライフログ</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-sub: #94a3b8;
      --accent: #38bdf8;
      --running: #ef4444;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); padding: 16px; padding-bottom: 60px; max-width: 600px; margin: 0 auto; }
    
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .header h1 { font-size: 1.2rem; font-weight: bold; }
    .header-btns { display: flex; gap: 8px; }
    .btn-sm { background: var(--card-bg); border: 1px solid var(--border); color: var(--text); padding: 6px 10px; border-radius: 8px; font-size: 0.8rem; cursor: pointer; }

    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 24px; }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: transform 0.05s;
    }
    .card:active { transform: scale(0.97); }
    .card.running { border: 2px solid var(--running); background: rgba(239, 68, 68, 0.1); }
    .card-top { display: flex; justify-content: space-between; align-items: center; }
    .card-icon { font-size: 1.5rem; }
    .card-status { font-size: 0.75rem; font-weight: bold; color: var(--text-sub); }
    .card.running .card-status { color: var(--running); }
    .card-name { font-weight: bold; font-size: 1rem; }
    .card-timer { font-size: 0.85rem; color: var(--text-sub); font-variant-numeric: tabular-nums; }
    .card.running .card-timer { color: var(--running); font-weight: bold; }

    h2 { font-size: 0.9rem; color: var(--text-sub); margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .history-list { display: flex; flex-direction: column; gap: 8px; }
    .history-item {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }
    .history-left { display: flex; align-items: center; gap: 10px; }
    .history-meta { font-size: 0.75rem; color: var(--text-sub); }
    .history-dur { font-size: 0.9rem; font-weight: bold; color: var(--accent); }
    .history-thumbs { display: flex; gap: 4px; }
    .history-img-thumb { width: 32px; height: 32px; border-radius: 4px; object-fit: cover; }

    /* モーダル共通 */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); align-items: center; justify-content: center; padding: 20px; z-index: 100; }
    .modal-box { background: var(--card-bg); padding: 20px; border-radius: 12px; width: 100%; max-width: 380px; border: 1px solid var(--border); max-height: 90vh; overflow-y: auto; }
    .modal-box input, .modal-box textarea { width: 100%; padding: 8px; margin: 4px 0 12px; background: #0f172a; border: 1px solid var(--border); color: #fff; border-radius: 6px; }
    .modal-btns { display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px; }
    .btn-action { padding: 8px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; border: none; font-size: 0.85rem; }
    .btn-submit { background: #3b82f6; color: #fff; }
    .btn-danger { background: #ef4444; color: #fff; }
    .btn-cancel { background: transparent; border: 1px solid var(--border); color: var(--text-sub); }
    .del-tag { background: #334155; border: none; color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; margin: 2px; cursor: pointer; }
    .preview-grid { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
    .preview-img-wrap { position: relative; }
    .preview-img-wrap img { width: 100%; border-radius: 6px; }
    .preview-img-wrap button { position: absolute; top: 4px; right: 4px; background: rgba(0,0,0,0.6); color: #fff; border: none; border-radius: 4px; padding: 2px 6px; cursor: pointer; }
  </style>
</head>
<body>

  <div class="header">
    <h1>⚡ iライフログ</h1>
    <div class="header-btns">
      <button class="btn-sm" onclick="exportEvernote()">Evernote出力</button>
      <button class="btn-sm" onclick="openCatModal()">＋ カテゴリ</button>
    </div>
  </div>

  <div class="grid" id="grid"></div>

  <h2>
    <span>本日の履歴</span>
    <span style="font-size: 0.75rem; color: var(--accent);">※タップして修正・写真追加</span>
  </h2>
  <div class="history-list" id="history"></div>

  <!-- カテゴリモーダル -->
  <div class="modal" id="catModal">
    <div class="modal-box">
      <h3 style="margin-bottom: 12px;">カテゴリ追加</h3>
      <label style="font-size: 0.8rem; color: var(--text-sub);">アイコン（絵文字）</label>
      <input type="text" id="catIcon" value="📌" maxlength="2">
      <label style="font-size: 0.8rem; color: var(--text-sub);">カテゴリ名</label>
      <input type="text" id="catName">
      <div class="modal-btns">
        <button class="btn-action btn-cancel" onclick="closeCatModal()">閉じる</button>
        <button class="btn-action btn-submit" onclick="addCategory()">追加</button>
      </div>
      <div style="margin-top: 16px; border-top: 1px solid var(--border); padding-top: 12px;">
        <div style="font-size: 0.75rem; color: var(--text-sub); margin-bottom: 6px;">タップしてカテゴリ削除:</div>
        <div id="delList"></div>
      </div>
    </div>
  </div>

  <!-- ログ編集モーダル -->
  <div class="modal" id="editModal">
    <div class="modal-box">
      <h3 style="margin-bottom: 12px;" id="editModalTitle">ログ編集</h3>
      <input type="hidden" id="editLogId">
      
      <label style="font-size: 0.8rem; color: var(--text-sub);">開始時刻</label>
      <input type="time" id="editStartTime">

      <label style="font-size: 0.8rem; color: var(--text-sub);">終了時刻</label>
      <input type="time" id="editEndTime">

      <label style="font-size: 0.8rem; color: var(--text-sub);">メモ</label>
      <textarea id="editMemo" rows="3"></textarea>

      <label style="font-size: 0.8rem; color: var(--text-sub);">写真の追加（複数選択可）</label>
      <input type="file" id="editPhoto" accept="image/*" multiple onchange="handlePhotoUpload(event)">
      <div id="imagePreviewContainer" class="preview-grid"></div>

      <div class="modal-btns">
        <button class="btn-action btn-danger" onclick="deleteCurrentLog()">削除</button>
        <button class="btn-action btn-cancel" onclick="closeEditModal()">キャンセル</button>
        <button class="btn-action btn-submit" onclick="saveLogEdit()">保存</button>
      </div>
    </div>
  </div>

  <script>
    const DEFAULT_CATS = [
      { id: 'move', name: '移動→', icon: '⇢' },
      { id: 'coffee', name: '珈琲 ☕ Time', icon: '☕' },
      { id: 'work', name: '仕事 🧳', icon: '💼' },
      { id: 'meal', name: '食事', icon: '🍴' },
      { id: 'rest', name: '休憩', icon: '☕' },
      { id: 'exercise', name: '運動', icon: '🏃' },
      { id: 'housework', name: '家事', icon: '🧹' },
      { id: 'sleep', name: '睡眠', icon: '🌙' }
    ];

    let cats = JSON.parse(localStorage.getItem('ll_cats') || JSON.stringify(DEFAULT_CATS));
    let logs = JSON.parse(localStorage.getItem('ll_logs') || '[]');
    let currentPhotos = [];

    function save() {
      localStorage.setItem('ll_cats', JSON.stringify(cats));
      localStorage.setItem('ll_logs', JSON.stringify(logs));
      render();
    }

    function toggleLog(cat) {
      const runningIdx = logs.findIndex(l => l.catId === cat.id && !l.endAt);
      if (runningIdx >= 0) {
        logs[runningIdx].endAt = new Date().toISOString();
      } else {
        logs.unshift({
          id: Date.now().toString(),
          catId: cat.id,
          name: cat.name,
          icon: cat.icon,
          startAt: new Date().toISOString(),
          endAt: null,
          memo: '',
          photos: []
        });
      }
      save();
    }

    function formatDuration(startStr, endStr) {
      const start = new Date(startStr).getTime();
      const end = endStr ? new Date(endStr).getTime() : Date.now();
      const sec = Math.max(0, Math.floor((end - start) / 1000));
      const mins = Math.floor(sec / 60);
      if (mins < 60) return `${mins}分`;
      const hrs = Math.floor(mins / 60);
      const remMins = mins % 60;
      return `${hrs}時間 ${remMins}分`;
    }

    function formatTimeSingleDigit(isoStr) {
      if (!isoStr) return '';
      const d = new Date(isoStr);
      return `${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`;
    }

    function timeInputFormat(isoStr) {
      if (!isoStr) return '';
      const d = new Date(isoStr);
      return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    }

    function render() {
      const grid = document.getElementById('grid');
      grid.innerHTML = cats.map(c => {
        const running = logs.find(l => l.catId === c.id && !l.endAt);
        return `
          <div class="card ${running ? 'running' : ''}" onclick="toggleLog(${JSON.stringify(c).replace(/"/g, '&quot;')})">
            <div class="card-top">
              <span class="card-icon">${c.icon}</span>
              <span class="card-status">${running ? '記録中' : '開始'}</span>
            </div>
            <div class="card-name">${c.name}</div>
            <div class="card-timer">${running ? formatDuration(running.startAt) : '00:00:00'}</div>
          </div>
        `;
      }).join('');

      const hist = document.getElementById('history');
      const today = new Date().toDateString();
      const todayLogs = logs.filter(l => l.endAt && new Date(l.startAt).toDateString() === today);
      
      if (todayLogs.length === 0) {
        hist.innerHTML = '<div style="color: var(--text-sub); font-size: 0.85rem;">本日の記録はありません</div>';
      } else {
        hist.innerHTML = todayLogs.map(l => {
          const photos = l.photos || (l.photo ? [l.photo] : []);
          return `
            <div class="history-item" onclick="openEditModal('${l.id}')">
              <div class="history-left">
                <span style="font-size: 1.2rem;">${l.icon}</span>
                <div>
                  <div style="font-weight: bold; font-size: 0.9rem;">${l.name} ${l.memo ? '📝' : ''}</div>
                  <div class="history-meta">${formatTimeSingleDigit(l.startAt)} - ${formatTimeSingleDigit(l.endAt)}</div>
                </div>
              </div>
              <div style="display: flex; align-items: center; gap: 8px;">
                <div class="history-thumbs">
                  ${photos.map(p => `<img src="${p}" class="history-img-thumb">`).join('')}
                </div>
                <div class="history-dur">${formatDuration(l.startAt, l.endAt)}</div>
              </div>
            </div>
          `;
        }).join('');
      }

      document.getElementById('delList').innerHTML = cats.map(c => `
        <button class="del-tag" onclick="deleteCat('${c.id}')">${c.icon} ${c.name} ✕</button>
      `).join('');
    }

    function openCatModal() { document.getElementById('catModal').style.display = 'flex'; }
    function closeCatModal() { document.getElementById('catModal').style.display = 'none'; }

    function addCategory() {
      const name = document.getElementById('catName').value.trim();
      const icon = document.getElementById('catIcon').value.trim() || '📌';
      if (!name) return;
      cats.push({ id: Date.now().toString(), name, icon });
      document.getElementById('catName').value = '';
      closeCatModal();
      save();
    }

    function deleteCat(id) {
      cats = cats.filter(c => c.id !== id);
      save();
    }

    function openEditModal(id) {
      const log = logs.find(l => l.id === id);
      if (!log) return;
      document.getElementById('editLogId').value = log.id;
      document.getElementById('editModalTitle').innerText = `${log.icon} ${log.name} の編集`;
      document.getElementById('editStartTime').value = timeInputFormat(log.startAt);
      document.getElementById('editEndTime').value = timeInputFormat(log.endAt);
      document.getElementById('editMemo').value = log.memo || '';
      currentPhotos = log.photos ? [...log.photos] : (log.photo ? [log.photo] : []);

      renderPreviewPhotos();
      document.getElementById('editPhoto').value = '';
      document.getElementById('editModal').style.display = 'flex';
    }

    function renderPreviewPhotos() {
      const prev = document.getElementById('imagePreviewContainer');
      prev.innerHTML = currentPhotos.map((p, idx) => `
        <div class="preview-img-wrap">
          <img src="${p}">
          <button type="button" onclick="removePhoto(${idx})">削除</button>
        </div>
      `).join('');
    }

    function removePhoto(idx) {
      currentPhotos.splice(idx, 1);
      renderPreviewPhotos();
    }

    function handlePhotoUpload(e) {
      const files = Array.from(e.target.files);
      files.forEach(file => {
        const reader = new FileReader();
        reader.onload = function(evt) {
          currentPhotos.push(evt.target.result);
          renderPreviewPhotos();
        };
        reader.readAsDataURL(file);
      });
    }

    function closeEditModal() { document.getElementById('editModal').style.display = 'none'; }

    function saveLogEdit() {
      const id = document.getElementById('editLogId').value;
      const log = logs.find(l => l.id === id);
      if (!log) return;

      const sVal = document.getElementById('editStartTime').value;
      const eVal = document.getElementById('editEndTime').value;

      if (sVal) {
        const d = new Date(log.startAt);
        const [hh, mm] = sVal.split(':');
        d.setHours(hh, mm, 0);
        log.startAt = d.toISOString();
      }
      if (eVal && log.endAt) {
        const d = new Date(log.endAt);
        const [hh, mm] = eVal.split(':');
        d.setHours(hh, mm, 0);
        log.endAt = d.toISOString();
      }

      log.memo = document.getElementById('editMemo').value.trim();
      log.photos = currentPhotos;
      delete log.photo;

      closeEditModal();
      save();
    }

    function deleteCurrentLog() {
      const id = document.getElementById('editLogId').value;
      logs = logs.filter(l => l.id !== id);
      closeEditModal();
      save();
    }

    /* Evernote出力（見出しタグ・強制大サイズ化） */
    async function exportEvernote() {
      const todayStr = new Date().toISOString().slice(0, 10);
      const todayLogs = logs.filter(l => l.endAt && l.startAt.startsWith(todayStr)).reverse();
      
      if (todayLogs.length === 0) {
        alert('本日の記録がありません');
        return;
      }

      let html = `<div>`;
      let plain = ``;

      todayLogs.forEach(l => {
        const timeRange = `${formatTimeSingleDigit(l.startAt)} - ${formatTimeSingleDigit(l.endAt)} (${formatDuration(l.startAt, l.endAt)})`;
        const photos = l.photos || (l.photo ? [l.photo] : []);

        // Evernoteでもサイズが縮小されないよう h1/h2 と font size 属性を併用
        html += `<h1 style="font-size: 36px; margin: 0; padding: 0;"><font size="7">${l.icon}</font></h1>`;
        html += `<h2 style="font-size: 24px; margin: 2px 0 0 0; padding: 0;"><font size="5"><b>${l.name}</b></font></h2>`;
        html += `<p style="font-size: 14px; color: #888888; margin: 2px 0 4px 0;"><font size="2">${timeRange}</font></p>`;
        
        plain += `${l.icon}\n${l.name}\n${timeRange}\n`;

        if (l.memo) {
          html += `<p style="font-size: 15px; margin: 4px 0 8px 0; white-space: pre-wrap;">${l.memo}</p>`;
          plain += `${l.memo}\n`;
        }

        photos.forEach(p => {
          html += `<p style="margin: 8px 0;"><img src="${p}" style="max-width: 100%; border-radius: 4px; display: block;"></p>`;
        });

        html += `<p><br></p>`;
        plain += `\n\n`;
      });
      html += `</div>`;

      try {
        const blobHtml = new Blob([html], { type: 'text/html' });
        const blobPlain = new Blob([plain], { type: 'text/plain' });
        const data = [new ClipboardItem({ 'text/html': blobHtml, 'text/plain': blobPlain })];
        await navigator.clipboard.write(data);
        alert('Evernote用ログ（大アイコン・大見出し）をコピーしました！\nEvernoteに貼り付けてご確認ください。');
      } catch (err) {
        navigator.clipboard.writeText(plain).then(() => {
          alert('テキストをコピーしました');
        });
      }
    }

    setInterval(render, 1000);
    render();
  </script>
</body>
</html>
