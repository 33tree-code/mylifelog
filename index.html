<!-- 期間集計・分析レポートエリア -->
<div class="report-section" style="margin-top: 20px; padding: 15px; border: 1px solid #ccc; border-radius: 8px; background: #fafafa;">
  <h3 style="margin-top: 0; font-size: 16px; display: flex; align-items: center; gap: 8px;">
    <img src="report-icon.png" alt="集計" style="width: 20px; height: 20px;"> 期間集計・分析レポート
  </h3>

  <!-- 期間選択ボタン -->
  <div style="display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap;">
    <button type="button" class="btn" onclick="selectReportPeriod('lastWeek')" style="display: flex; align-items: center; gap: 6px;">
      <img src="report-icon.png" style="width: 16px; height: 16px;"> 先週（日〜土）
    </button>
    <button type="button" class="btn" onclick="selectReportPeriod('lastMonth')" style="display: flex; align-items: center; gap: 6px;">
      <img src="report-icon.png" style="width: 16px; height: 16px;"> 前月
    </button>
    <button type="button" class="btn" onclick="toggleCustomRange()" style="display: flex; align-items: center; gap: 6px;">
      <img src="report-icon.png" style="width: 16px; height: 16px;"> 期間指定
    </button>
  </div>

  <!-- 自由期間指定（初期は非表示） -->
  <div id="customRangeArea" style="display: none; margin-bottom: 12px; gap: 8px; align-items: center;">
    <input type="date" id="reportStartDate" class="input-date">
    <span>〜</span>
    <input type="date" id="reportEndDate" class="input-date">
    <button type="button" class="btn" onclick="applyCustomRange()">適用</button>
  </div>

  <!-- 選択中の期間表示 -->
  <div id="selectedPeriodLabel" style="font-size: 13px; color: #555; margin-bottom: 12px; font-weight: bold;">
    対象期間: 未選択
  </div>

  <!-- アクションボタン -->
  <div style="display: flex; gap: 8px; flex-wrap: wrap;">
    <button type="button" class="btn btn-primary" onclick="showReportModal()" style="display: flex; align-items: center; gap: 6px;">
      <img src="report-icon.png" style="width: 16px; height: 16px;"> グラフ・内訳を表示
    </button>
    <button type="button" class="btn btn-success" onclick="exportReportToEvernote()" style="display: flex; align-items: center; gap: 6px;">
      <img src="report-icon.png" style="width: 16px; height: 16px;"> 集計をEvernoteへ出力
    </button>
  </div>
</div>

<!-- 集計表示モーダル（ポップアップ） -->
<div id="reportModal" class="modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center;">
  <div style="background: #fff; width: 90%; max-width: 500px; max-height: 85vh; border-radius: 8px; padding: 20px; overflow-y: auto; position: relative;">
    <button type="button" onclick="closeReportModal()" style="position: absolute; top: 10px; right: 10px; background: none; border: none; font-size: 20px; cursor: pointer;">✕</button>
    
    <h2 style="font-size: 18px; margin-top: 0; display: flex; align-items: center; gap: 8px;">
      <img src="report-icon.png" style="width: 22px; height: 22px;"> 期間集計レポート
    </h2>
    <div id="modalPeriodText" style="font-size: 13px; color: #666; margin-bottom: 15px;"></div>

    <!-- 円グラフ描画領域 -->
    <div style="width: 100%; max-width: 320px; margin: 0 auto 20px auto;">
      <canvas id="reportChart"></canvas>
    </div>

    <!-- 内訳一覧 -->
    <h3 style="font-size: 15px; margin-bottom: 8px; border-bottom: 1px solid #eee; padding-bottom: 4px;">カテゴリ別内訳</h3>
    <div id="reportSummaryList" style="font-size: 14px; line-height: 1.6;"></div>

    <div style="margin-top: 20px; text-align: center;">
      <button type="button" class="btn btn-success" onclick="exportReportToEvernote()" style="width: 100%; padding: 10px;">
        📋 この集計をEvernoteにコピー
      </button>
    </div>
  </div>
</div>
