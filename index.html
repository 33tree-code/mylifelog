<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ライフログ</title>
<style>
  :root {
    --bg: #0b1120;
    --card-bg: #1e293b;
    --text: #f8fafc;
    --text-sub: #94a3b8;
    --accent: #38bdf8;
    --running: #ef4444;
    --border: #334155;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
  body { 
    background: var(--bg); 
    color: var(--text); 
    padding: env(safe-area-inset-top, 12px) 12px env(safe-area-inset-bottom, 24px) 12px; 
    max-width: 480px; 
    margin: 0 auto; 
    user-select: none;
  }
  
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .header h1 { font-size: 1.15rem; font-weight: 700; letter-spacing: -0.5px; white-space: nowrap; }
  .header-btns { display: flex; gap: 6px; }
  .btn-sm { background: var(--card-bg); border: 1px solid var(--border); color: var(--text); padding: 6px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 500; cursor: pointer; white-space: nowrap; }
  .btn-evernote { background: #2563eb; color: #fff; border: none; font-weight: 600; }
  
  /* 最上部：記録中エリア */
  .active-section { margin-bottom: 12px; display: none; }
  .active-card { background: rgba(239, 68, 68, 0.12); border: 1.5px solid var(--running); border-radius: 10px; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .active-left { display: flex; align-items: center; gap: 10px; flex: 1; }
  .active-icon { font-size: 1.4rem; }
  .active-title { font-weight: bold; font-size: 0.95rem; }
  .active-badge { font-size: 0.7rem; color: var(--running); }
  .active-right { display: flex; align-items: center; gap: 8px; }
  .active-timer { font-size: 1.05rem; font-weight: 700; color: var(--running); font-variant-numeric: tabular-nums; }
  .btn-active-edit { background: var(--running); color: #fff; border: none; padding: 4px 8px; border-radius: 6px; font-size: 0.72rem; font-weight: bold; cursor: pointer; }

  /* グリッド一覧 */
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 16px; }
  .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 10px; cursor: pointer; display: flex; flex-direction: column; gap: 3px; }
  .card.running { border: 1.5px solid var(--running); background: rgba(239, 68, 68, 0.1); }
  .card-top { display: flex; justify-content: space-between; align-items: center; }
  .card-icon { font-size: 1.3rem; }
  .card-status { font-size: 0.7rem; font-weight: 600; color: var(--text-sub); }
  .card.running .card-status { color: var(--running); }
  .card-name { font-weight: 600; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-timer { font-size: 0.75rem; color: var(--text-sub); font-variant-numeric: tabular-nums; }
  .card.running .card-timer { color: var(--running); font-weight: 600; }
  
  h2 { font-size: 0.85rem; color: var(--text-sub); margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
  .history-list { display: flex; flex-direction: column; gap: 6px; }
  .history-item { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
  .history-left { display: flex; align-items: center; gap: 8px; }
  .history-meta { font-size: 0.7rem; color: var(--text-sub); }
  .history-dur { font-size: 0.85rem; font-weight: 700; color: var(--accent); }
  .history-thumbs { display: flex; gap: 4px; }
  .history-img-thumb { width: 28px; height: 28px; border-radius: 4px; object-fit: cover; }
  
  .modal { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.75); align-items: center; justify-content: center; padding: 16px; z-index: 100; }
  .modal-box { background: var(--card-bg); padding: 16px; border-radius: 12px; width: 100%; max-width: 360px; border: 1px solid var(--border); max-height: 85vh; overflow-y: auto; }
  .modal-box input, .modal-box textarea { width: 100%; padding: 8px; margin: 4px 0 10px; background: #0b1120; border: 1px solid var(--border); color: #fff; border-radius: 6px; font-size: 0.9rem; }
  .modal-btns { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; margin-top: 8px; }
  .btn-action { padding: 7px 10px; border-radius: 6px; font-weight: 600; cursor: pointer; border: none; font-size: 0.78rem; }
  .btn-submit { background: #2563eb; color: #fff; }
  .btn-danger { background: #ef4444; color: #fff; }
  .btn-cancel { background: transparent; border: 1px solid var(--border); color: var(--text-sub); }
  
  /* ドラッグ対応の設定項目 */
  .sort-item { display: flex; align-items: center; gap: 6px; background: #0b1120; padding: 8px; border-radius: 8px; margin-bottom: 8px; border: 1px solid var(--border); touch-action: none; }
  .sort-item.dragging { opacity: 0.4; border: 1px dashed var(--accent); }
  .drag-handle { color: var(--text-sub); font-size: 1.1rem; cursor: grab; padding: 0 4px; user-select: none; }
  .sort-icon-input { width: 40px !important; text-align: center; margin: 0 !important; padding: 6px 2px !important; font-size: 1.1rem !important; }
  .sort-name-input { flex: 1; margin: 0 !important; padding: 6px 8px !important; font-size: 0.85rem !important; }
  .btn-del-cat { background: #ef4444; border: none; color: #fff; padding: 6px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; cursor: pointer; }
  
  .preview-grid { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
  .preview-img-wrap { position: relative; }
  .preview-img-wrap img { width: 100%; border-radius: 6px; }
  .preview-img-wrap button { position: absolute; top: 4px; right: 4px; background: rgba(0, 0, 0, 0.7); color: #fff; border: none; border-radius: 4px; padding: 2px 6px; font-size: 0.75rem; }
</style>
</head>
<body>

<div class="header">
  <h1>⌚ ライフログ</h1>
  <div class="header-btns">
    <button class="btn-sm btn-evernote" onclick="exportEvernoteYesterday()">Evernote出力 (前日)</button>
    <button class="btn-sm" onclick="openSettingModal()">⚙</button>
    <button class="btn-sm" onclick="openCatModal()">＋</button>
  </div>
</div>

<!-- 最上部：記録中エリア -->
<div class="active-section" id="activeSection">
  <div style="font-size:0.75rem;color:var(--running);font-weight:bold;margin-bottom:4px;">⌚ 現在記録中</div>
  <div id="activeList"></div>
</div>

<div class="grid" id="grid"></div>

<h2>
  <span>本日の履歴</span>
  <span style="font-size:0.7rem;color:var(--accent);">※タップして編集・写真追加</span>
</h2>
<div class="history-list" id="history"></div>

<!-- カテゴリ追加モーダル -->
<div class="modal" id="catModal">
  <div class="modal-box">
    <h3 style="margin-bottom:10px;font-size:1rem;">カテゴリ追加</h3>
    <label style="font-size:0.75rem;color:var(--text-sub);">アイコン（絵文字）</label>
    <input type="text" id="catIcon" value="📌" maxlength="2">
    <label style="font-size:0.75rem;color:var(--text-sub);">カテゴリ名</label>
    <input type="text" id="catName">
    <div class="modal-btns">
      <button class="btn-action btn-cancel" onclick="closeCatModal()">閉じる</button>
      <button class="btn-action btn-submit" onclick="addCategory()">追加</button>
    </div>
  </div>
</div>

<!-- ⚙ カテゴリ設定モーダル（ドラッグ並び替え対応） -->
<div class="modal" id="settingModal">
  <div class="modal-box">
    <h3 style="margin-bottom:6px;font-size:1rem;">カテゴリ設定・並び替え</h3>
    <div style="font-size:0.7rem;color:var(--text-sub);margin-bottom:10px;">≡を長押しドラッグで並び替え、文字を直接編集できます</div>
    <div id="settingList" style="max-height:55vh;overflow-y:auto;margin-bottom:12px;"></div>
    <div class="modal-btns">
      <button class="btn-action btn-submit" onclick="closeSettingModal()">完了</button>
    </div>
  </div>
</div>

<!-- ログ編集・写真モーダル -->
<div class="modal" id="editModal">
  <div class="modal-box">
    <h3 style="margin-bottom:10px;font-size:1rem;" id="editModalTitle">ログ編集</h3>
    <input type="hidden" id="editLogId">
    
    <label style="font-size:0.75rem;color:var(--text-sub);">開始時刻</label>
    <input type="time" id="editStartTime">
    
    <div id="endTimeWrap">
      <label style="font-size:0.75rem;color:var(--text-sub);">終了時刻</label>
      <input type="time" id="editEndTime">
    </div>
    
    <label style="font-size:0.75rem;color:var(--text-sub);">メモ</label>
    <textarea id="editMemo" rows="2" placeholder="メモを入力..."></textarea>
    
    <label style="font-size:0.75rem;color:var(--text-sub);">写真追加（複数可）</label>
    <input type="file" id="editPhoto" accept="image/*" multiple onchange="handlePhotoUpload(event)">
    <div id="imagePreviewContainer" class="preview-grid"></div>

    <div class="modal-btns">
      <button class="btn-action btn-danger" onclick="deleteCurrentLog()">削除</button>
      <button class="btn-action btn-cancel" onclick="closeEditModal()">閉じる</button>
      <button class="btn-action btn-submit" id="btnStopAndSave" style="background:var(--running);display:none;" onclick="saveLogEdit(true)">終了して保存</button>
      <button class="btn-action btn-submit" onclick="saveLogEdit(false)">保存</button>
    </div>
  </div>
</div>

<script>
  const DEFAULT_CATS = [
    { id: 'move', name: '移動→', icon: '⇢' },
    { id: 'coffee', name: '珈琲 ☕ Time', icon: '☕' },
    { id: 'work', name: '仕事 🧳', icon: '💼' },
    { id: 'meal', name: '食事', icon: '🍽' },
    { id: 'rest', name: '休憩', icon: '☕' },
    { id: 'exercise', name: '運動', icon: '🏃' },
    { id: 'housework', name: '家事', icon: '🧹' },
    { id: 'sleep', name: '睡眠', icon: '🌙' }
  ];

  let cats = JSON.parse(localStorage.getItem('ll_cats') || JSON.stringify(DEFAULT_CATS));
  let logs = JSON.parse(localStorage.getItem('ll_logs') || '[]');
  let currentPhotos = [];

  function saveOnly() {
    localStorage.setItem('ll_cats', JSON.stringify(cats));
    localStorage.setItem('ll_logs', JSON.stringify(logs));
  }

  function save() {
    saveOnly();
    render();
  }

  function toggleLog(c) {
    const i = logs.findIndex(l => l.catId === c.id && !l.endAt);
    if (i >= 0) {
      logs[i].endAt = new Date().toISOString();
    } else {
      logs.unshift({
        id: Date.now().toString(),
        catId: c.id,
        name: c.name,
        icon: c.icon,
        startAt: new Date().toISOString(),
        endAt: null,
        memo: '',
        photos: []
      });
    }
    save();
  }

  function formatDuration(s, e) {
    const sec = Math.max(0, Math.floor(((e ? new Date(e) : new Date()) - new Date(s)) / 1000));
    const m = Math.floor(sec / 60);
    if (m < 60) return `${m}分`;
    return `${Math.floor(m / 60)}h ${m % 60}m`;
  }

  function formatTimeSingleDigit(s) {
    if (!s) return '';
    const d = new Date(s);
    return `${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`;
  }

  function timeInputFormat(s) {
    if (!s) return '';
    const d = new Date(s);
    return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
  }

  function render() {
    const runningLogs = logs.filter(l => !l.endAt);
    const activeSection = document.getElementById('activeSection');
    const activeList = document.getElementById('activeList');

    if (runningLogs.length > 0) {
      activeSection.style.display = 'block';
      activeList.innerHTML = runningLogs.map(r => `
        <div class="active-card">
          <div class="active-left" onclick="toggleLog({id:'${r.catId}', name:'${r.name}', icon:'${r.icon}'})">
            <span class="active-icon">${r.icon}</span>
            <div>
              <div class="active-title">${r.name} ${r.memo ? '📝' : ''}</div>
              <div class="active-badge">タップで停止 (${formatTimeSingleDigit(r.startAt)}〜)</div>
            </div>
          </div>
          <div class="active-right">
            <div class="active-timer">${formatDuration(r.startAt)}</div>
            <button class="btn-active-edit" onclick="openEditModal('${r.id}')">編集</button>
          </div>
        </div>
      `).join('');
    } else {
      activeSection.style.display = 'none';
    }

    const g = document.getElementById('grid');
    g.innerHTML = cats.map(c => {
      const r = logs.find(l => l.catId === c.id && !l.endAt);
      return `
        <div class="card ${r ? 'running' : ''}" onclick="toggleLog(${JSON.stringify(c).replace(/"/g, '&quot;')})">
          <div class="card-top">
            <span class="card-icon">${c.icon}</span>
            <span class="card-status">${r ? '記録中' : '開始'}</span>
          </div>
          <div class="card-name">${c.name}</div>
          <div class="card-timer">${r ? formatDuration(r.startAt) : '00:00:00'}</div>
        </div>
      `;
    }).join('');

    const h = document.getElementById('history');
    const t = new Date().toDateString();
    const tl = logs.filter(l => l.endAt && new Date(l.startAt).toDateString() === t);
    
    if (tl.length === 0) {
      h.innerHTML = '<div style="color:var(--text-sub);font-size:0.8rem;text-align:center;padding:12px 0;">本日の記録はありません</div>';
    } else {
      h.innerHTML = tl.map(l => {
        const p = l.photos || (l.photo ? [l.photo] : []);
        return `
          <div class="history-item" onclick="openEditModal('${l.id}')">
            <div class="history-left">
              <span style="font-size:1.1rem;">${l.icon}</span>
              <div>
                <div style="font-weight:600;font-size:0.85rem;">${l.name} ${l.memo ? '📝' : ''}</div>
                <div class="history-meta">${formatTimeSingleDigit(l.startAt)} - ${formatTimeSingleDigit(l.endAt)}</div>
              </div>
            </div>
            <div style="display:flex;align-items:center;gap:6px;">
              <div class="history-thumbs">
                ${p.map(x => `<img src="${x}" class="history-img-thumb">`).join('')}
              </div>
              <div class="history-dur">${formatDuration(l.startAt, l.endAt)}</div>
            </div>
          </div>
        `;
      }).join('');
    }
  }

  /* カテゴリ追加 */
  function openCatModal() { document.getElementById('catModal').style.display = 'flex'; }
  function closeCatModal() { document.getElementById('catModal').style.display = 'none'; }
  function addCategory() {
    const n = document.getElementById('catName').value.trim();
    const i = document.getElementById('catIcon').value.trim() || '📌';
    if (!n) return;
    cats.push({ id: Date.now().toString(), name: n, icon: i });
    document.getElementById('catName').value = '';
    closeCatModal();
    save();
  }

  /* ⚙ 設定モーダル（ドラッグ並び替え対応） */
  function openSettingModal() {
    renderSettingList();
    document.getElementById('settingModal').style.display = 'flex';
  }
  function closeSettingModal() { 
    document.getElementById('settingModal').style.display = 'none'; 
    render();
  }
  
  let draggedIndex = null;

  function renderSettingList() {
    const el = document.getElementById('settingList');
    el.innerHTML = cats.map((c, i) => `
      <div class="sort-item" draggable="true" data-index="${i}">
        <span class="drag-handle">≡</span>
        <input type="text" class="sort-icon-input" value="${c.icon}" maxlength="2" onchange="updateCatItem('${c.id}', 'icon', this.value)">
        <input type="text" class="sort-name-input" value="${c.name}" onchange="updateCatItem('${c.id}', 'name', this.value)">
        <button type="button" class="btn-del-cat" onclick="deleteCat('${c.id}')">✕</button>
      </div>
    `).join('');

    // ドラッグ＆ドロップイベント設定
    const items = el.querySelectorAll('.sort-item');
    items.forEach(item => {
      item.addEventListener('dragstart', handleDragStart);
      item.addEventListener('dragover', handleDragOver);
      item.addEventListener('drop', handleDrop);
      item.addEventListener('dragend', handleDragEnd);

      // スマホ用タッチ操作
      item.addEventListener('touchstart', handleTouchStart, {passive: true});
      item.addEventListener('touchmove', handleTouchMove, {passive: false});
      item.addEventListener('touchend', handleTouchEnd);
    });
  }

  function handleDragStart(e) {
    draggedIndex = parseInt(this.getAttribute('data-index'));
    this.classList.add('dragging');
  }
  function handleDragOver(e) {
    e.preventDefault();
  }
  function handleDrop(e) {
    e.preventDefault();
    const targetIndex = parseInt(this.getAttribute('data-index'));
    if (draggedIndex !== null && draggedIndex !== targetIndex) {
      const movedItem = cats.splice(draggedIndex, 1)[0];
      cats.splice(targetIndex, 0, movedItem);
      saveOnly();
      renderSettingList();
      render();
    }
  }
  function handleDragEnd() {
    this.classList.remove('dragging');
  }

  // タッチデバイス用ドラッグ処理
  let touchTarget = null;
  function handleTouchStart(e) {
    touchTarget = this;
    draggedIndex = parseInt(this.getAttribute('data-index'));
  }
  function handleTouchMove(e) {
    if (!touchTarget) return;
    const touch = e.touches[0];
    const elem = document.elementFromPoint(touch.clientX, touch.clientY);
    const item = elem ? elem.closest('.sort-item') : null;
    if (item && item !== touchTarget) {
      const targetIndex = parseInt(item.getAttribute('data-index'));
      const movedItem = cats.splice(draggedIndex, 1)[0];
      cats.splice(targetIndex, 0, movedItem);
      draggedIndex = targetIndex;
      saveOnly();
      renderSettingList();
      render();
    }
    e.preventDefault();
  }
  function handleTouchEnd() {
    touchTarget = null;
    draggedIndex = null;
  }
  
  function updateCatItem(id, key, val) {
    const cat = cats.find(c => c.id === id);
    if (!cat) return;
    cat[key] = val.trim();
    saveOnly();
    render();
  }
  
  function deleteCat(id) {
    cats = cats.filter(c => c.id !== id);
    saveOnly();
    renderSettingList();
    render();
  }

  /* ログ編集 */
  function openEditModal(id) {
    const l = logs.find(x => x.id === id);
    if (!l) return;
    document.getElementById('editLogId').value = l.id;
    document.getElementById('editModalTitle').innerText = `${l.icon} ${l.name} の編集`;
    document.getElementById('editStartTime').value = timeInputFormat(l.startAt);
    
    const endWrap = document.getElementById('endTimeWrap');
    const btnStopAndSave = document.getElementById('btnStopAndSave');
    
    if (l.endAt) {
      endWrap.style.display = 'block';
      btnStopAndSave.style.display = 'none';
      document.getElementById('editEndTime').value = timeInputFormat(l.endAt);
    } else {
      endWrap.style.display = 'none';
      btnStopAndSave.style.display = 'inline-block';
    }
    
    document.getElementById('editMemo').value = l.memo || '';
    currentPhotos = l.photos ? [...l.photos] : (l.photo ? [l.photo] : []);
    renderPreviewPhotos();
    document.getElementById('editPhoto').value = '';
    document.getElementById('editModal').style.display = 'flex';
  }

  function renderPreviewPhotos() {
    document.getElementById('imagePreviewContainer').innerHTML = currentPhotos.map((p, i) => `
      <div class="preview-img-wrap">
        <img src="${p}">
        <button type="button" onclick="removePhoto(${i})">削除</button>
      </div>
    `).join('');
  }

  function removePhoto(i) {
    currentPhotos.splice(i, 1);
    renderPreviewPhotos();
  }

  function handlePhotoUpload(e) {
    Array.from(e.target.files).forEach(f => {
      const r = new FileReader();
      r.onload = evt => {
        currentPhotos.push(evt.target.result);
        renderPreviewPhotos();
      };
      r.readAsDataURL(f);
    });
  }

  function closeEditModal() { document.getElementById('editModal').style.display = 'none'; }

  function saveLogEdit(stopTimer = false) {
    const id = document.getElementById('editLogId').value;
    const l = logs.find(x => x.id === id);
    if (!l) return;
    
    const s = document.getElementById('editStartTime').value;
    const e = document.getElementById('editEndTime').value;
    
    if (s) {
      const d = new Date(l.startAt);
      const [h, m] = s.split(':');
      d.setHours(h, m, 0);
      l.startAt = d.toISOString();
    }
    if (l.endAt && e) {
      const d = new Date(l.endAt);
      const [h, m] = e.split(':');
      d.setHours(h, m, 0);
      l.endAt = d.toISOString();
    }
    
    if (stopTimer && !l.endAt) {
      l.endAt = new Date().toISOString();
    }
    
    l.memo = document.getElementById('editMemo').value.trim();
    l.photos = currentPhotos;
    delete l.photo;
    
    closeEditModal();
    save();
  }

  function deleteCurrentLog() {
    logs = logs.filter(l => l.id !== document.getElementById('editLogId').value);
    closeEditModal();
    save();
  }

  /* Evernote出力（前日分を抽出） */
  async function exportEvernoteYesterday() {
    const now = new Date();
    const targetDate = new Date(now);
    targetDate.setDate(targetDate.getDate() - 1); // 常に前日を対象

    const days = ['日', '月', '火', '水', '木', '金', '土'];
    const y = targetDate.getFullYear();
    const m = String(targetDate.getMonth() + 1).padStart(2, '0');
    const d = String(targetDate.getDate()).padStart(2, '0');
    const w = days[targetDate.getDay()];
    const dateTitle = `${y}/${m}/${d}(${w})`;

    const targetDateStr = targetDate.toDateString();
    const tl = logs.filter(l => l.endAt && new Date(l.startAt).toDateString() === targetDateStr).reverse();
    
    if (tl.length === 0) {
      alert(`前日（${dateTitle}）の記録はありません`);
      return;
    }

    let html = `<div><h1 style="font-size:22px;font-weight:bold;margin-bottom:12px;">${dateTitle}</h1><hr style="border:0;border-top:1px solid #ccc;margin-bottom:12px;">`;
    let plain = `${dateTitle}\n====================\n\n`;

    tl.forEach(l => {
      const tr = `${formatTimeSingleDigit(l.startAt)} - ${formatTimeSingleDigit(l.endAt)} (${formatDuration(l.startAt, l.endAt)})`;
      const p = l.photos || (l.photo ? [l.photo] : []);
      
      html += `
        <h2 style="font-size:28px;margin:0;padding:0;"><font size="6">${l.icon}</font></h2>
        <h3 style="font-size:18px;margin:2px 0 0 0;padding:0;"><font size="4"><b>${l.name}</b></font></h3>
        <p style="font-size:13px;color:#888888;margin:2px 0 4px 0;"><font size="2">${tr}</font></p>
      `;
      plain += `${l.icon}\n${l.name}\n${tr}\n`;

      if (l.memo) {
        html += `<p style="font-size:14px;margin:4px 0 8px 0;white-space:pre-wrap;">${l.memo}</p>`;
        plain += `${l.memo}\n`;
      }
      p.forEach(x => {
        html += `<p style="margin:6px 0;"><img src="${x}" style="max-width:100%;border-radius:4px;display:block;"></p>`;
      });
      html += '<p><br></p>';
      plain += '\n\n';
    });
    html += '</div>';

    try {
      const bh = new Blob([html], { type: 'text/html' });
      const bp = new Blob([plain], { type: 'text/plain' });
      const item = [new ClipboardItem({ 'text/html': bh, 'text/plain': bp })];
      await navigator.clipboard.write(item);
      alert(`前日（${dateTitle}）のログをコピーしました！\nEvernoteに貼り付けてください。`);
    } catch (err) {
      navigator.clipboard.writeText(plain).then(() => {
        alert(`前日（${dateTitle}）のテキストをコピーしました`);
      });
    }
  }

  setInterval(render, 1000);
  render();
</script>
</body>
</html>
